  <rect x="308" y="323" width="48" height="20" rx="6" fill="#FFFFFF" />
  
  <!-- Row 3 -->
  <rect x="152" y="351" width="50" height="20" rx="6" fill="#FFFFFF" />
  <rect x="231" y="351" width="50" height="20" rx="6" fill="#FFFFFF" />
