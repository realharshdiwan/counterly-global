  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Receipt Paper -->
  <path d="M196 100 L316 100 L316 160 L196 160 Z" fill="#FFFFFF" filter="url(#shadow)" />
  <rect x="216" y="118" width="80" height="8" rx="4" fill="#0A5F34" opacity="0.6" />
