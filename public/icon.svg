  <rect x="210" y="210" width="92" height="10" rx="3" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Base & Keypad -->
  <path d="M136 270 L376 270 L396 390 L116 390 Z" fill="#FFFFFF" filter="url(#shadow)" />
  <path d="M148 280 L364 280 L382 380 L130 380 Z" fill="#064E2B" />
  
